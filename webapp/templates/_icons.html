{%- elif name == 'menu' %}<path d="M4 7h16M4 12h16M4 17h16"/>

{%- endif %}</svg>
{%- endmacro %}

{% macro stack(counts, classes) -%}
{%- set total = counts.values()|sum -%}
<div class="stack" role="img" aria-label="Sebaran per kelas">
  {%- for c in classes %}{% if counts[c] %}<i class="bg-{{ c }}" style="width: {{ counts[c] / total * 100 }}%"></i>{% endif %}{% endfor %}
</div>
<div class="legend">{% for c in classes %}<span class="k-{{ c }}" style="--cc:var(--c-{{ c }})">{{ c|capitalize }} <b>{{ counts[c] }}</b></span>{% endfor %}</div>
{%- endmacro %}
